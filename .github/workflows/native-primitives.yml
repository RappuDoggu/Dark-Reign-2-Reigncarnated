name: Native primitives and Android diagnostic
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reviewed upstream separately
        run: bash tools/fetch_upstream.sh "$RUNNER_TEMP/dr2-upstream"
      - name: Compile and test original primitives and platform services
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cmake -S . -B build-host -DREIGN_UPSTREAM="$RUNNER_TEMP/dr2-upstream" -DREIGN_SANITIZE=ON 2>&1 | tee evidence/configure.log
          cmake --build build-host --verbose 2>&1 | tee evidence/build.log
          ctest --test-dir build-host -V 2>&1 | tee evidence/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-compilation-and-test-logs
          path: evidence/*.log
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch reviewed upstream separately
        run: bash tools/fetch_upstream.sh "$RUNNER_TEMP/dr2-upstream"
      - name: Install pinned NDK and SDK tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          bash tools/install_android_sdk.sh "$RUNNER_TEMP/reign-sdk" 2>&1 | tee evidence/android-toolchain-install.log
      - name: Compile ARM64 and verify local diagnostic package
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/reign-sdk"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export REIGN_UPSTREAM="$RUNNER_TEMP/dr2-upstream"
          mkdir -p evidence
          bash tools/package_android.sh 2>&1 | tee evidence/android-build-package.log
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h -l build-android/libreign_diagnostic.so > evidence/android-elf.log
      - name: Install software EGL runtime for pixel tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Test initial GLES translation on software EGL
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/stage_khronos_headers.py "$RUNNER_TEMP/reign-sdk/ndk/27.2.12479018" "$RUNNER_TEMP/reign-khronos"
          cmake -S . -B build-render-host -DREIGN_UPSTREAM="$RUNNER_TEMP/dr2-upstream" -DREIGN_GLES_BACKEND=ON -DREIGN_KHRONOS_HEADERS="$RUNNER_TEMP/reign-khronos"
          cmake --build build-render-host --target gles_smoke
          LIBGL_ALWAYS_SOFTWARE=1 ctest --test-dir build-render-host -R gles_legacy_pixels -V 2>&1 | tee evidence/gles-pixel-tests.log
      - name: Build original-only renderer test APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/reign-sdk"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash tools/package_asset_probe.sh 2>&1 | tee evidence/asset-probe-package.log
      - uses: actions/upload-artifact@v4
        with:
          name: Reigncarnated-Renderer-Test-v03-arm64
          path: build-asset-probe/Reigncarnated-Renderer-Test-v03.apk
      # Engine-derived binaries remain excluded. The APK above links only original porting tools.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-compilation-and-package-logs
          path: evidence/*.log
